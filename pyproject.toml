[project]
name = "reyclient"
version = "1.0.49"
description = "Method integration package for calling third-party APIs."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
keywords = [
    "rey",
    "reyxbo",
    "client",
    "request",
    "API",
    "alibaba",
    "baidu",
    "AI",
]
authors = [
    {name = "Rey", email = "reyxbo@163.com"}
]
dependencies = [
    "alibabacloud_dypnsapi20170525",
    "alibabacloud_tea_openapi>=0.4.3",
    "reydb",
    "reykit"
]

[project.urls]
Homepage = "https://www.reyxbo.com/release/python/reyclient"
Repository = "https://github.com/reyxbo/reyclient-py.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
